<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Player card: THEO / AGUS, Level 01, class Electrical to Technology, status Learning, Bandung Indonesia">
<title>Player card: THEO / AGUS, Level 01, class Electrical to Technology, status Learning, Bandung Indonesia</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111113"/><stop offset="1" stop-color="#08080a"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6ecd0"/><stop offset=".5" stop-color="#d9c08e"/><stop offset="1" stop-color="#b39358"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
<linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d6a6" stop-opacity=".16"/><stop offset="1" stop-color="#e9d6a6" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#d9c08e" stop-opacity=".28"/><stop offset="1" stop-color="#d9c08e" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<clipPath id="clip"><rect width="900" height="440" rx="24"/></clipPath>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,'Segoe UI',Roboto,Arial,sans-serif}
.float{animation:float 7s ease-in-out infinite}
.float2{animation:float 9s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.drift{animation:drift 16s ease-in-out infinite alternate}
.drift2{animation:drift 21s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(-40px,0)}to{transform:translate(60px,18px)}}
.sweep{opacity:0;animation:sweep 9s linear infinite}
@keyframes sweep{from{opacity:1;transform:translateX(-260px) skewX(-20deg)}to{opacity:1;transform:translateX(1160px) skewX(-20deg)}}
.orbit{animation:orbit 7s linear infinite}
@keyframes orbit{to{stroke-dashoffset:-1000}}
.flow{animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.bar{transform-box:fill-box;transform-origin:left center;animation:loopbar 8s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes loopbar{0%{transform:scaleX(0);opacity:0}6%{opacity:1}38%,88%{transform:scaleX(1);opacity:1}96%,100%{transform:scaleX(1);opacity:0}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.slide{animation:slide .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.p{opacity:0;animation:particle 11s linear infinite}
@keyframes particle{0%{transform:translateY(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)">
<rect width="900" height="440" fill="url(#bg)"/>
<ellipse class="drift" cx="220" cy="88" rx="260" ry="140" fill="url(#glow)"/>
<ellipse class="drift2" cx="700" cy="374" rx="300" ry="150" fill="url(#glow)" opacity=".7"/>
<circle class="p" cx="77" cy="221" r="1" fill="#d8bf8f" style="animation-delay:-4.0s;animation-duration:9.2s"/><circle class="p" cx="848" cy="369" r="1.6" fill="#d8bf8f" style="animation-delay:-2.8s;animation-duration:9.5s"/><circle class="p" cx="56" cy="346" r="1.2" fill="#d8bf8f" style="animation-delay:-11.0s;animation-duration:12.5s"/><circle class="p" cx="842" cy="383" r="1.6" fill="#d8bf8f" style="animation-delay:-6.0s;animation-duration:11.1s"/><circle class="p" cx="294" cy="428" r="1" fill="#d8bf8f" style="animation-delay:-9.6s;animation-duration:10.5s"/><circle class="p" cx="346" cy="430" r="2" fill="#d8bf8f" style="animation-delay:-4.7s;animation-duration:14.2s"/><circle class="p" cx="188" cy="341" r="1.2" fill="#d8bf8f" style="animation-delay:-2.6s;animation-duration:8.2s"/><circle class="p" cx="352" cy="242" r="1.2" fill="#d8bf8f" style="animation-delay:-5.6s;animation-duration:10.5s"/><circle class="p" cx="546" cy="370" r="1.2" fill="#d8bf8f" style="animation-delay:-10.9s;animation-duration:11.1s"/><circle class="p" cx="444" cy="386" r="1.6" fill="#d8bf8f" style="animation-delay:-8.7s;animation-duration:10.5s"/><circle class="p" cx="476" cy="239" r="2" fill="#d8bf8f" style="animation-delay:-7.9s;animation-duration:11.2s"/><circle class="p" cx="563" cy="261" r="2" fill="#d8bf8f" style="animation-delay:-3.1s;animation-duration:11.5s"/><circle class="p" cx="547" cy="410" r="1.6" fill="#d8bf8f" style="animation-delay:-7.3s;animation-duration:11.2s"/><circle class="p" cx="492" cy="287" r="2" fill="#d8bf8f" style="animation-delay:-5.4s;animation-duration:9.6s"/><circle class="p" cx="352" cy="406" r="1.2" fill="#d8bf8f" style="animation-delay:-9.6s;animation-duration:12.3s"/><circle class="p" cx="811" cy="320" r="1.6" fill="#d8bf8f" style="animation-delay:-3.3s;animation-duration:13.6s"/>
<circle cx="46" cy="50" r="3" fill="#d8bf8f" class="pulse"/><text x="60" y="54" font-size="12" fill="#d8bf8f" font-weight="600" text-anchor="start" letter-spacing="6" opacity="1" >PLAYER CARD</text><rect x="40" y="76" width="820" height="324" rx="26" fill="url(#glass)" stroke="#fff" stroke-opacity="0.14"/><path d="M66 76.5H834" stroke="#fff" stroke-opacity=".25" stroke-linecap="round"/><circle cx="175" cy="238" r="110" fill="url(#glow)" class="pulse"/><circle class="spin" cx="175" cy="238" r="80" fill="none" stroke="#d8bf8f" stroke-opacity=".7" stroke-dasharray="2 10" stroke-linecap="round"/><circle cx="175" cy="238" r="64" fill="none" stroke="#fff" stroke-opacity=".16"/><circle cx="175" cy="238" r="52" fill="url(#glass)" stroke="#d8bf8f" stroke-opacity=".5"/><g transform="translate(147.4,210.4) scale(2.3)"><path d="M13 2L5 13.5H10.5L9 22L19 9.5H13.5Z" fill="#d8bf8f"/></g><rect x="113" y="340" width="124" height="34" rx="17" fill="url(#glass)" stroke="#fff" stroke-opacity="0.14"/><path d="M130 340.5H220" stroke="#fff" stroke-opacity=".25" stroke-linecap="round"/><text x="175" y="362" font-size="13" fill="#d8bf8f" font-weight="600" text-anchor="middle" letter-spacing="3" opacity="1" >LEVEL 01</text><text x="340" y="130" font-size="11" fill="#9d968a" font-weight="500" text-anchor="start" letter-spacing="4" opacity="1" >PLAYER</text><text x="340" y="164" font-size="28" fill="#f3ead7" font-weight="600" text-anchor="start" letter-spacing="1" opacity="1" >THEO / AGUS</text><text x="610" y="130" font-size="11" fill="#9d968a" font-weight="500" text-anchor="start" letter-spacing="4" opacity="1" >LEVEL</text><text x="610" y="164" font-size="28" fill="#d8bf8f" font-weight="600" text-anchor="start" letter-spacing="1" opacity="1" >01</text><text x="340" y="214" font-size="11" fill="#9d968a" font-weight="500" text-anchor="start" letter-spacing="4" opacity="1" >XP</text><text x="820" y="214" font-size="12" fill="#d8bf8f" font-weight="600" text-anchor="end" letter-spacing="2" opacity="1" >05 / 10</text><rect x="340" y="226" width="480" height="12" rx="6" fill="#fff" fill-opacity=".08"/><rect class="bar" x="340" y="226" width="240" height="12" rx="6" fill="url(#gold)"/><circle class="pulse" cx="580" cy="232" r="9" fill="url(#glow)"/><text x="340" y="288" font-size="11" fill="#9d968a" font-weight="500" text-anchor="start" letter-spacing="4" opacity="1" >CLASS</text><text x="340" y="316" font-size="20" fill="#f3ead7" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" >Electrical → Technology</text><text x="610" y="288" font-size="11" fill="#9d968a" font-weight="500" text-anchor="start" letter-spacing="4" opacity="1" >STATUS</text><circle class="pulse" cx="615" cy="310" r="5" fill="#d8bf8f"/><text x="630" y="316" font-size="20" fill="#d8bf8f" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" >Learning</text><text x="340" y="352" font-size="11" fill="#9d968a" font-weight="500" text-anchor="start" letter-spacing="4" opacity="1" >LOCATION</text><text x="340" y="380" font-size="20" fill="#f3ead7" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" >Bandung, Indonesia</text><text x="820" y="380" font-size="11" fill="#9d968a" font-weight="400" text-anchor="end" letter-spacing="1" opacity="0.8" >level and xp are visual only</text>
<rect class="sweep" x="0" y="0" width="150" height="440" fill="url(#sweepg)"/>
<rect width="900" height="440" fill="url(#vig)"/>
</g>
<rect x="1" y="1" width="898" height="438" rx="23" fill="none" stroke="#fff" stroke-opacity=".08"/>
<rect class="orbit" x="1" y="1" width="898" height="438" rx="23" fill="none" stroke="#d8bf8f" stroke-width="1.6" stroke-linecap="round" pathLength="1000" stroke-dasharray="130 870"/>
</svg>
