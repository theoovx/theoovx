 >CSS</text><rect x="134.4" y="238" width="36" height="26" rx="13" fill="none" stroke="#d8bf8f" stroke-opacity=".55"/><text x="152.6" y="255.5" font-size="11" fill="#d8bf8f" font-weight="500" text-anchor="middle" letter-spacing="0.5" opacity="1" >JS</text></g></g><g transform="translate(320,90)"><g class="float2" style="animation-delay:-1.7s"><rect x="0" y="0" width="260" height="290" rx="22" fill="url(#glass)" stroke="#fff" stroke-opacity=".14"/><path d="M22 .5H238" stroke="#fff" stroke-opacity=".28" stroke-linecap="round"/><rect x="24" y="24" width="48" height="48" rx="14" fill="#fff" fill-opacity=".05" stroke="#d8bf8f" stroke-opacity=".5"/><circle cx="48" cy="48" r="13" fill="none" stroke="#d8bf8f" stroke-width="2"/><path d="M48 40V48L54 52" fill="none" stroke="#d8bf8f" stroke-width="2" stroke-linecap="round"/><text x="236" y="52" font-size="10" fill="#9d968a" font-weight="600" text-anchor="end" letter-spacing="2" opacity="1" >WEB / PWA</text><text x="24" y="108" font-size="18" fill="#f3ead7" font-weight="600" text-anchor="start" letter-spacing="0.2" opacity="1" >Theo Daily</text><text x="24" y="140" font-size="13.5" fill="#f3ead7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.7" >Personal productivity and</text><text x="24" y="161" font-size="13.5" fill="#f3ead7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.7" >daily dashboard, explored</text><text x="24" y="182" font-size="13.5" fill="#f3ead7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.7" >as a PWA concept.</text><rect x="24" y="238" width="87" height="26" rx="13" fill="none" stroke="#d8bf8f" stroke-opacity=".55"/><text x="67.4" y="255.5" font-size="11" fill="#d8bf8f" font-weight="500" text-anchor="middle" letter-spacing="0.5" opacity="1" >Dashboard</text><rect x="118.8" y="238" width="44" height="26" rx="13" fill="none" stroke="#d8bf8f" stroke-opacity=".55"/><text x="140.6" y="255.5" font-size="11" fill="#d8bf8f" font-weight="500" text-anchor="middle" letter-spacing="0.5" opacity="1" >PWA</text></g></g><g transform="translate(600,90)"><g class="float" style="animation-delay:-3.4s"><rect x="0" y="0" width="260" height="290" rx="22" fill="url(#glass)" stroke="#fff" stroke-opacity=".14"/><path d="M22 .5H238" stroke="#fff" stroke-opacity=".28" stroke-linecap="round"/><rect x="24" y="24" width="48" height="48" rx="14" fill="#fff" fill-opacity=".05" stroke="#d8bf8f" stroke-opacity=".5"/><rect x="40" y="40" width="16" height="16" rx="3" fill="none" stroke="#d8bf8f" stroke-width="2"/><path d="M44 36V40M44 56V60M36 44H40M56 44H60" stroke="#d8bf8f" stroke-width="1.6" stroke-linecap="round"/><path d="M48 36V40M48 56V60M36 48H40M56 48H60" stroke="#d8bf8f" stroke-width="1.6" stroke-linecap="round"/><path d="M52 36V40M52 56V60M36 52H40M56 52H60" stroke="#d8bf8f" stroke-width="1.6" stroke-linecap="round"/><text x="236" y="52" font-size="10" fill="#9d968a" font-weight="600" text-anchor="end" letter-spacing="2" opacity="1" >IoT</text><text x="24" y="108" font-size="18" fill="#f3ead7" font-weight="600" text-anchor="start" letter-spacing="0.2" opacity="1" >Smart Building / IoT</text><text x="24" y="140" font-size="13.5" fill="#f3ead7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.7" >Learning project around</text><text x="24" y="161" font-size="13.5" fill="#f3ead7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.7" >ESP32, sensors and</text><text x="24" y="182" font-size="13.5" fill="#f3ead7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.7" >electrical systems.</text><rect x="24" y="238" width="58" height="26" rx="13" fill="none" stroke="#d8bf8f" stroke-opacity=".55"/><text x="53.0" y="255.5" font-size="11" fill="#d8bf8f" font-weight="500" text-anchor="middle" letter-spacing="0.5" opacity="1" >ESP32</text><rect x="90.0" y="238" width="72" height="26" rx="13" fill="none" stroke="#d8bf8f" stroke-opacity=".55"/><text x="126.2" y="255.5" font-size="11" fill="#d8bf8f" font-weight="500" text-anchor="middle" letter-spacing="0.5" opacity="1" >Sensors</text><rect x="170.4" y="238" width="44" height="26" rx="13" fill="none" stroke="#d8bf8f" stroke-opacity=".55"/><text x="192.20000000000002" y="255.5" font-size="11" fill="#d8bf8f" font-weight="500" text-anchor="middle" letter-spacing="0.5" opacity="1" >IoT</text></g></g>
