<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Project room: Link Bio, Theo Daily, Smart Building and IoT">
<title>Project room: Link Bio, Theo Daily, Smart Building and IoT</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111113"/><stop offset="1" stop-color="#08080a"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6ecd0"/><stop offset=".5" stop-color="#d9c08e"/><stop offset="1" stop-color="#b39358"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
<linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d6a6" stop-opacity=".16"/><stop offset="1" stop-color="#e9d6a6" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#d9c08e" stop-opacity=".28"/><stop offset="1" stop-color="#d9c08e" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<clipPath id="clip"><rect width="900" height="430" rx="24"/></clipPath>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Inter,'Segoe UI',Roboto,Arial,sans-serif}
.float{animation:float 7s ease-in-out infinite}
.float2{animation:float 9s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.drift{animation:drift 16s ease-in-out infinite alternate}
.drift2{animation:drift 21s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(-40px,0)}to{transform:translate(60px,18px)}}
.sweep{opacity:0;animation:sweep 9s linear infinite}
@keyframes sweep{from{opacity:1;transform:translateX(-260px) skewX(-20deg)}to{opacity:1;transform:translateX(1160px) skewX(-20deg)}}
.orbit{animation:orbit 7s linear infinite}
@keyframes orbit{to{stroke-dashoffset:-1000}}
.flow{animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.bar{transform-box:fill-box;transform-origin:left center;animation:loopbar 8s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes loopbar{0%{transform:scaleX(0);opacity:0}6%{opacity:1}38%,88%{transform:scaleX(1);opacity:1}96%,100%{transform:scaleX(1);opacity:0}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.slide{animation:slide .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.p{opacity:0;animation:particle 11s linear infinite}
@keyframes particle{0%{transform:translateY(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)">
<rect width="900" height="430" fill="url(#bg)"/>
<ellipse class="drift" cx="220" cy="86" rx="260" ry="140" fill="url(#glow)"/>
<ellipse class="drift2" cx="700" cy="365" rx="300" ry="150" fill="url(#glow)" opacity=".7"/>
<circle class="p" cx="832" cy="339" r="1" fill="#d8bf8f" style="animation-delay:-5.3s;animation-duration:9.8s"/><circle class="p" cx="20" cy="230" r="2" fill="#d8bf8f" style="animation-delay:-10.6s;animation-duration:13.1s"/><circle class="p" cx="347" cy="390" r="1" fill="#d8bf8f" style="animation-delay:-3.0s;animation-duration:13.6s"/><circle class="p" cx="767" cy="416" r="2" fill="#d8bf8f" style="animation-delay:-10.0s;animation-duration:11.8s"/><circle class="p" cx="116" cy="242" r="1.6" fill="#d8bf8f" style="animation-delay:-7.3s;animation-duration:12.3s"/><circle class="p" cx="110" cy="409" r="2" fill="#d8bf8f" style="animation-delay:-3.7s;animation-duration:8.7s"/><circle class="p" cx="839" cy="297" r="1.6" fill="#d8bf8f" style="animation-delay:-4.9s;animation-duration:8.7s"/><circle class="p" cx="221" cy="372" r="1.6" fill="#d8bf8f" style="animation-delay:-1.1s;animation-duration:8.3s"/><circle class="p" cx="225" cy="404" r="1.6" fill="#d8bf8f" style="animation-delay:-5.4s;animation-duration:13.8s"/><circle class="p" cx="218" cy="324" r="1" fill="#d8bf8f" style="animation-delay:-7.0s;animation-duration:9.7s"/><circle class="p" cx="460" cy="270" r="1.6" fill="#d8bf8f" style="animation-delay:-6.5s;animation-duration:8.6s"/><circle class="p" cx="714" cy="327" r="1.2" fill="#d8bf8f" style="animation-delay:-1.3s;animation-duration:12.6s"/><circle class="p" cx="339" cy="377" r="1.2" fill="#d8bf8f" style="animation-delay:-4.2s;animation-duration:9.6s"/><circle class="p" cx="631" cy="246" r="1" fill="#d8bf8f" style="animation-delay:-2.1s;animation-duration:9.2s"/><circle class="p" cx="683" cy="278" r="1.6" fill="#d8bf8f" style="animation-delay:-4.1s;animation-duration:11.7s"/><circle class="p" cx="316" cy="225" r="2" fill="#d8bf8f" style="animation-delay:-0.6s;animation-duration:11.0s"/>
