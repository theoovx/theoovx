tart" letter-spacing="0" opacity="1" >GitHub</text></g></g><g transform="translate(293,164)"><g class="float" style="animation-delay:-7.8s"><rect x="0" y="0" width="150" height="56" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity="0.14"/><path d="M28 0.5H122" stroke="#fff" stroke-opacity=".25" stroke-linecap="round"/><circle cx="32" cy="28" r="18" fill="none" stroke="#d8bf8f" stroke-opacity=".6"/><text x="32" y="32" font-size="11" fill="#d8bf8f" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1" >ESP</text><text x="60" y="33" font-size="15" fill="#f3ead7" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" >ESP32</text></g></g><g transform="translate(457,164)"><g class="float2" style="animation-delay:-9.1s"><rect x="0" y="0" width="150" height="56" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity="0.14"/><path d="M28 0.5H122" stroke="#fff" stroke-opacity=".25" stroke-linecap="round"/><circle cx="32" cy="28" r="18" fill="none" stroke="#d8bf8f" stroke-opacity=".6"/><text x="32" y="32" font-size="11" fill="#d8bf8f" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1" >IoT</text><text x="60" y="33" font-size="15" fill="#f3ead7" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" >IoT</text></g></g><g transform="translate(621,164)"><g class="float" style="animation-delay:-10.4s"><rect x="0" y="0" width="150" height="56" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity="0.14"/><path d="M28 0.5H122" stroke="#fff" stroke-opacity=".25" stroke-linecap="round"/><circle cx="32" cy="28" r="18" fill="none" stroke="#d8bf8f" stroke-opacity=".6"/><text x="32" y="32" font-size="11" fill="#d8bf8f" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1" >VS</text><text x="60" y="33" font-size="15" fill="#f3ead7" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" >VS Code</text></g></g>
