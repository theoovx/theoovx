-delay:-8.1s;animation-duration:12.0s"/><circle class="p" cx="55" cy="224" r="2" fill="#d8bf8f" style="animation-delay:-10.5s;animation-duration:9.7s"/><circle class="p" cx="645" cy="322" r="1" fill="#d8bf8f" style="animation-delay:-8.1s;animation-duration:13.9s"/><circle class="p" cx="554" cy="344" r="1" fill="#d8bf8f" style="animation-delay:-9.5s;animation-duration:8.8s"/><circle class="p" cx="618" cy="286" r="2" fill="#d8bf8f" style="animation-delay:-2.3s;animation-duration:9.4s"/>
<polygon class="pulse" points="420,0 480,0 640,430 260,430" fill="url(#beam)"/><path d="M450 80V108" stroke="#fff" stroke-opacity=".14"/><path class="flow" d="M450 80V108" stroke="#d8bf8f" stroke-opacity=".85" stroke-dasharray="6 18" stroke-linecap="round"/><path d="M444 98L450 106L456 98" fill="none" stroke="#d8bf8f" stroke-opacity=".9" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(340,40)"><g class="rise" style="animation-delay:0.0s"><rect x="0" y="0" width="220" height="40" rx="20" fill="url(#glass)" stroke="#fff" stroke-opacity="0.16"/><path d="M20 .5H200" stroke="#fff" stroke-opacity=".25" stroke-linecap="round"/><text x="110" y="26" font-size="14" fill="#f3ead7" font-weight="600" text-anchor="middle" letter-spacing="5" opacity="1" >ELECTRICAL</text></g></g><path d="M450 148V176" stroke="#fff" stroke-opacity=".14"/><path class="flow" d="M450 148V176" stroke="#d8bf8f" stroke-opacity=".85" stroke-dasharray="6 18" stroke-linecap="round"/><path d="M444 166L450 174L456 166" fill="none" stroke="#d8bf8f" stroke-opacity=".9" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(340,108)"><g class="rise" style="animation-delay:0.2s"><rect x="0" y="0" width="220" height="40" rx="20" fill="url(#glass)" stroke="#fff" stroke-opacity="0.16"/><path d="M20 .5H200" stroke="#fff" stroke-opacity=".25" stroke-linecap="round"/><text x="110" y="26" font-size="14" fill="#f3ead7" font-weight="600" text-anchor="middle" letter-spacing="5" opacity="1" >CURIOUS</text></g></g><path d="M450 216V244" stroke="#fff" stroke-opacity=".14"/><path class="flow" d="M450 216V244" stroke="#d8bf8f" stroke-opacity=".85" stroke-dasharray="6 18" stroke-linecap="round"/><path d="M444 234L450 242L456 234" fill="none" stroke="#d8bf8f" stroke-opacity=".9" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(340,176)"><g class="rise" style="animation-delay:0.4s"><rect x="0" y="0" width="220" height="40" rx="20" fill="url(#glass)" stroke="#fff" stroke-opacity="0.16"/><path d="M20 .5H200" stroke="#fff" stroke-opacity=".25" stroke-linecap="round"/><text x="110" y="26" font-size="14" fill="#f3ead7" font-weight="600" text-anchor="middle" letter-spacing="5" opacity="1" >LEARNING</text></g></g><g transform="translate(340,244)"><g class="rise" style="animation-delay:0.6s"><rect x="0" y="0" width="220" height="40" rx="20" fill="rgba(216,191,143,.16)" stroke="#d8bf8f" stroke-opacity="0.7"/><path d="M20 .5H200" stroke="#fff" stroke-opacity=".25" stroke-linecap="round"/><text x="110" y="26" font-size="14" fill="#d8bf8f" font-weight="600" text-anchor="middle" letter-spacing="5" opacity="1" >BUILDING</text></g></g><text x="450" y="348" font-size="34" fill="url(#gold)" font-weight="600" text-anchor="middle" letter-spacing="0.5" opacity="1" >Still learning. Still building.</text><text x="450" y="392" font-size="13" fill="#9d968a" font-weight="500" text-anchor="middle" letter-spacing="6" opacity="1" >theoovx</text>
<rect class="sweep" x="0" y="0" width="150" height="430" fill="url(#sweepg)"/>
<rect width="900" height="430" fill="url(#vig)"/>
</g>
<rect x="1" y="1" width="898" height="428" rx="23" fill="none" stroke="#fff" stroke-opacity=".08"/>
<rect class="orbit" x="1" y="1" width="898" height="428" rx="23" fill="none" stroke="#d8bf8f" stroke-width="1.6" stroke-linecap="round" pathLength="1000" stroke-dasharray="130 870"/>
</svg>
